[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "take-note"
version = "1.10.2"
description = "A sticky notes app for Linux (Python + PySide6/Qt6) — rich text, tags, notepads, and a searchable Notes Manager."
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "PySide6",
    "python-xlib",
]

[project.optional-dependencies]
spellcheck = ["pyenchant"]

[project.scripts]
take-note = "take_note.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["take_note"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "genbadge[coverage]",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Spelled out rather than left to ruff's built-in default, which ruff
# 0.17 widened (blind-except, import sorting, ...) — the default
# silently changing under an unpinned CI install broke lint on code
# nobody had touched.
select = ["E4", "E7", "E9", "F"]
