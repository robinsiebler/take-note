[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "take-note"
version = "1.10.3"
description = "A sticky notes app for Linux (Python + PySide6/Qt6) — rich text, tags, notepads, and a searchable Notes Manager."
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    # PySide6 6.12.0 over-decrefs Py_None on every None-returning call
    # (setBrush, setPen, ...); harmless on 3.12+ where None is immortal,
    # but on 3.10/3.11 it reaches zero within seconds and aborts with
    # "none_dealloc: deallocating None".
    "PySide6!=6.12.0; python_version < '3.12'",
    "PySide6; python_version >= '3.12'",
    "python-xlib",
]

[project.optional-dependencies]
spellcheck = ["pyenchant"]

[project.scripts]
take-note = "take_note.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["take_note"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "genbadge[coverage]",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Spelled out rather than left to ruff's built-in default, which ruff
# 0.17 widened (blind-except, import sorting, ...) — the default
# silently changing under an unpinned CI install broke lint on code
# nobody had touched.
select = ["E4", "E7", "E9", "F"]
